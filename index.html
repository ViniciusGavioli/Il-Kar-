<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilê Asé Karè Oju Igbi — Cantigas</title>
<meta name="description" content="Letras, traduções e áudios de referência das cantigas do xirê e dos pontos de caboclo e boiadeiro — Ilê Asé Karè Oju Igbi.">
<meta property="og:title" content="Ilê Asé Karè Oju Igbi — Cantigas">
<meta property="og:description" content="Letras, traduções e áudios de referência das cantigas do xirê e dos pontos de caboclo e boiadeiro.">
<meta property="og:image" content="/crest.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<link rel="apple-touch-icon" href="/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7EF;
    --bg-elev: #FFFFFF;
    --bg-card: #FFFDF8;
    --line: #E7DCC3;
    --ink: #2B241C;
    --muted: #6B5D45;
    --gold: #B8892B;
    --gold-soft: #D9A94A;
    --gold-pale: #F1E2B8;
    --maroon: #6E1F1F;
    --radius: 16px;
    --shadow: 0 6px 22px rgba(80,60,20,.09);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(1000px 500px at 50% -8%, rgba(184,137,43,.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
    transition: padding-bottom .2s ease;
  }
  body.has-player { padding-bottom: 130px; }
  h1, h2, .display { font-family: 'Cormorant Garamond', Georgia, serif; }

  header.hero {
    position: relative;
    padding: 40px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #FFFFFF, rgba(241,226,184,.4) 75%);
    overflow: hidden;
  }
  header.hero::before {
    content: "";
    position: absolute;
    top: -60%; left: 50%;
    width: 500px; height: 500px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(184,137,43,.16), transparent 65%);
    pointer-events: none;
  }
  .crest {
    position: relative;
    width: 118px;
    height: auto;
    display: block;
    margin: 0 auto 16px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(184,137,43,.45), 0 12px 28px rgba(110,31,31,.16);
  }
  header.hero .eyebrow {
    position: relative;
    letter-spacing: .2em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 8px;
  }
  header.hero h1 {
    position: relative;
    font-size: 36px;
    font-weight: 700;
    margin: 0 0 8px;
    line-height: 1.08;
    color: var(--maroon);
  }
  .divider {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 4px auto 14px;
    width: 160px;
  }
  .divider span {
    height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .diamond {
    width: 6px; height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    flex: 0 0 auto;
  }
  header.hero .sub {
    position: relative;
    color: var(--muted);
    font-size: 14.5px;
    max-width: 440px;
    margin: 0 auto;
    line-height: 1.5;
  }
  header.hero .terreiro {
    position: relative;
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink);
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* ---------- Seletor de linha ---------- */
  .linha-switch {
    position: relative;
    display: flex;
    gap: 4px;
    max-width: 420px;
    margin: 20px auto 0;
    padding: 4px;
    background: rgba(255,255,255,.75);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .linha-btn {
    flex: 1 1 0;
    padding: 9px 10px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    -webkit-tap-highlight-color: transparent;
  }
  .linha-switch[hidden] { display: none; }
  .linha-btn[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(184,137,43,.3);
  }

  nav.toc-wrap {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(251,247,239,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  nav.toc-wrap[hidden] { display: none; }
  .toc-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 14px;
    scrollbar-width: none;
  }
  .toc-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 0 2px rgba(0,0,0,.04);
  }
  .chip-num { color: var(--muted); font-size: 11px; }
  .chip.active { border-color: var(--gold); background: var(--gold-pale); }

  main { max-width: 640px; margin: 0 auto; padding: 18px 14px 0; }
  .note {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .orixa {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-elev);
    margin-bottom: 12px;
    overflow: hidden;
    scroll-margin-top: 62px;
    box-shadow: var(--shadow);
  }
  .orixa-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    background: transparent;
    border: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .orixa-num {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: var(--accent2);
    font-weight: 700;
    font-size: 13px;
    font-family: 'Cormorant Garamond', serif;
  }
  .orixa-titles { flex: 1 1 auto; display: flex; flex-direction: column; }
  .orixa-nome { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 700; line-height: 1.15; color: var(--maroon); }
  .orixa-yoruba { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); margin-top: 1px; }
  .chevron {
    flex: 0 0 auto;
    color: var(--gold);
    font-size: 18px;
    transition: transform .25s ease;
  }
  .orixa.open .chevron { transform: rotate(180deg); }

  .orixa-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .28s ease;
  }
  .orixa.open .orixa-body { grid-template-rows: 1fr; }
  .orixa-body-inner { overflow: hidden; padding: 0 14px; }
  .orixa.open .orixa-body-inner { padding: 2px 14px 16px; }

  .cantiga {
    padding: 12px 0;
    border-top: 1px dashed var(--line);
  }
  .cantiga:first-child { border-top: none; }
  .cantiga-topo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 5px;
  }
  .cantiga-tag {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  .btn-trecho {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: #FFFFFF;
    color: var(--maroon);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-trecho .btn-ic { font-size: 9px; color: var(--gold); }
  .btn-trecho:active { transform: scale(.97); }
  .btn-trecho.is-active {
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    border-color: var(--gold);
    color: #FFFFFF;
  }
  .btn-trecho.is-active .btn-ic { color: #FFFFFF; }
  .lyric {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.55;
    letter-spacing: .002em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .trad {
    font-size: 14.5px;
    color: #6B5D45;
    line-height: 1.55;
    margin: 0;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn {
    flex: 1 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    min-width: 140px;
    font-family: inherit;
  }
  .btn-ic { font-size: 11px; }
  .btn-ghost {
    background: #FFFFFF;
    border-color: var(--line);
    color: var(--maroon);
  }
  .btn-practice {
    cursor: pointer;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #FFFFFF;
    flex-basis: 100%;
  }
  .btn-practice:active { transform: scale(.98); }
  .btn-practice.is-active {
    background: linear-gradient(180deg, #efe3c5, var(--gold-pale));
    color: var(--maroon);
  }

  /* ---------- Estado vazio ---------- */
  .vazio {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--bg-card);
    padding: 34px 22px;
    text-align: center;
    color: var(--muted);
  }
  .vazio-mark {
    width: 34px; height: 34px;
    margin: 0 auto 12px;
    background: var(--gold-pale);
    border: 1px solid var(--gold);
    transform: rotate(45deg);
  }
  .vazio h2 {
    font-size: 21px;
    color: var(--maroon);
    margin: 0 0 6px;
  }
  .vazio p { font-size: 13.5px; line-height: 1.55; margin: 0; }

  /* ---------- Mini player ---------- */
  .mini-player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: #FFFFFF;
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(80,60,20,.12);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .mini-player[hidden] { display: none; }
  .mini-player-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 640px;
    margin: 0 auto;
  }
  .mini-embed {
    position: relative;
    flex: 0 0 auto;
    width: 96px;
    height: 54px;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .mini-embed iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .mini-info { flex: 1 1 auto; min-width: 0; }
  .mini-eyebrow {
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .mini-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--maroon);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-close {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #FFFFFF;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .quick-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 700;
    margin: 30px 0 4px;
    color: var(--maroon);
  }
  .quick-sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .quick-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    width: 100%;
  }
  .quick-num { color: var(--muted); font-size: 10.5px; font-weight: 700; }
  .quick-name { flex: 1; }
  .quick-ic { color: var(--gold); font-size: 10px; }
  #blocoRapido[hidden] { display: none; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 34px;
    padding: 0 20px;
    line-height: 1.6;
  }
  footer strong { color: var(--maroon); }
  footer .credit {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    color: #B4A688;
  }

  @media (min-width: 560px) {
    header.hero h1 { font-size: 42px; }
  }
</style>
</head>
<body>

<header class="hero">
  <img class="crest" src="/crest.jpg" alt="Emblema Ilê Asé Karè Oju Igbi">
  <div class="eyebrow">Material de apoio interno</div>
  <h1 id="heroTitulo"></h1>
  <div class="divider"><span></span><span class="diamond"></span><span></span></div>
  <p class="sub" id="heroSub"></p>
  <div class="terreiro">Ilê Asé Karè Oju Igbi</div>
  <div class="linha-switch" id="linhaSwitch"></div>
</header>

<nav class="toc-wrap" id="tocWrap">
  <div class="toc-scroll" id="tocScroll"></div>
</nav>

<main>
  <div class="note" id="nota"></div>
  <div id="listaEntidades"></div>

  <div id="blocoRapido" hidden>
    <h2 class="quick-title">Lista rápida de áudios</h2>
    <p class="quick-sub">Se algum botão acima não abrir corretamente, use este atalho direto.</p>
    <div class="quick-grid" id="quickGrid"></div>
  </div>

  <footer>
    <strong>Ilê Asé Karè Oju Igbi</strong> — Cantigas<br>
    Material de apoio interno para estudo.
    <span class="credit">ileasekareojuigbi.vercel.app</span>
  </footer>
</main>

<div class="mini-player" id="miniPlayer" hidden>
  <div class="mini-player-inner">
    <div class="mini-embed"><div id="ytHost"></div></div>
    <div class="mini-info">
      <div class="mini-eyebrow">Praticando</div>
      <div class="mini-name" id="miniName"></div>
    </div>
    <button type="button" class="mini-close" id="miniClose" aria-label="Fechar player">&times;</button>
  </div>
</div>

<script src="/dados.js"></script>
<script>
(function () {
  'use strict';

  var LINHAS = window.CANTIGAS || [];

  var elSwitch  = document.getElementById('linhaSwitch');
  var elTitulo  = document.getElementById('heroTitulo');
  var elSub     = document.getElementById('heroSub');
  var elNota    = document.getElementById('nota');
  var elTocWrap = document.getElementById('tocWrap');
  var elToc     = document.getElementById('tocScroll');
  var elLista   = document.getElementById('listaEntidades');
  var elRapido  = document.getElementById('blocoRapido');
  var elGrid    = document.getElementById('quickGrid');

  var CHAVE = 'cantigas:linha';

  function lembrar(id) {
    try { localStorage.setItem(CHAVE, id); } catch (e) {}
  }
  function lembrada() {
    try { return localStorage.getItem(CHAVE); } catch (e) { return null; }
  }

  function numero(i) {
    return (i + 1 < 10 ? '0' : '') + (i + 1);
  }

  function el(tag, cls, texto) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function acharLinha(id) {
    for (var i = 0; i < LINHAS.length; i++) {
      if (LINHAS[i].id === id) return LINHAS[i];
    }
    return null;
  }

  // Descobre em que linha mora uma entidade, a partir do id dela (link direto).
  function linhaDaEntidade(entId) {
    for (var i = 0; i < LINHAS.length; i++) {
      var ents = LINHAS[i].entidades || [];
      for (var j = 0; j < ents.length; j++) {
        if (ents[j].id === entId) return LINHAS[i].id;
      }
    }
    return null;
  }

  // ---------- Construção de um bloco de entidade ----------

  // 74 -> "1:14"
  function relogio(seg) {
    var m = Math.floor(seg / 60), s = Math.floor(seg % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function montaCantiga(c, ent) {
    var box = el('div', 'cantiga');

    var topo = el('div', 'cantiga-topo');
    topo.appendChild(el('div', 'cantiga-tag', c.rotulo || ''));

    // Um vídeo só para a entidade inteira: cada cantiga ganha um botão que
    // pula direto para o seu momento dentro dele.
    var vid = c.video || ent.video;
    if (vid && c.inicio != null) {
      var bt = el('button', 'btn-trecho');
      bt.type = 'button';
      bt.setAttribute('data-vid', vid);
      bt.setAttribute('data-inicio', String(c.inicio));
      bt.setAttribute('data-name', (ent.nome || '') + ' — ' + (c.rotulo || ''));
      bt.setAttribute('aria-label', 'Tocar a partir de ' + relogio(c.inicio));
      rotuloTrecho(bt, relogio(c.inicio), false);
      bt.addEventListener('click', function () {
        if (bt.classList.contains('is-active')) { parar(); return; }
        tocar(vid, bt.getAttribute('data-name'), bt, c.inicio);
      });
      topo.appendChild(bt);
    }
    box.appendChild(topo);

    var p = el('p', 'lyric');
    var versos = c.letra || [];
    for (var i = 0; i < versos.length; i++) {
      if (i > 0) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(versos[i]));
    }
    box.appendChild(p);

    if (c.traducao) box.appendChild(el('p', 'trad', c.traducao));
    return box;
  }

  function montaEntidade(ent, i) {
    var sec = el('section', 'orixa');
    sec.id = ent.id;
    sec.style.setProperty('--accent', ent.cor || '#B8892B');
    sec.style.setProperty('--accent2', ent.corTexto || '#1a1a1a');

    var head = el('button', 'orixa-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    head.appendChild(el('span', 'orixa-num', numero(i)));

    var titulos = el('span', 'orixa-titles');
    titulos.appendChild(el('span', 'orixa-nome', ent.nome || ''));
    if (ent.subtitulo) titulos.appendChild(el('span', 'orixa-yoruba', ent.subtitulo));
    head.appendChild(titulos);
    head.appendChild(el('span', 'chevron', '⌄'));
    sec.appendChild(head);

    var body  = el('div', 'orixa-body');
    var inner = el('div', 'orixa-body-inner');

    (ent.cantigas || []).forEach(function (c) { inner.appendChild(montaCantiga(c, ent)); });

    var acoes = el('div', 'actions');
    if (ent.video) {
      var praticar = el('button', 'btn btn-practice');
      praticar.type = 'button';
      praticar.setAttribute('data-vid', ent.video);
      praticar.setAttribute('data-name', ent.nome || '');
      rotuloPraticar(praticar, false);
      acoes.appendChild(praticar);
    }
    if (ent.youtube) {
      var ly = el('a', 'btn btn-ghost', 'Abrir no YouTube');
      ly.href = ent.youtube; ly.target = '_blank'; ly.rel = 'noopener';
      acoes.appendChild(ly);
    }
    if (ent.fonte) {
      var lf = el('a', 'btn btn-ghost', 'Ver fonte da letra');
      lf.href = ent.fonte; lf.target = '_blank'; lf.rel = 'noopener';
      acoes.appendChild(lf);
    }
    if (acoes.childNodes.length) inner.appendChild(acoes);

    body.appendChild(inner);
    sec.appendChild(body);

    head.addEventListener('click', function () { alternar(sec); });
    return sec;
  }

  function rotuloPraticar(btn, tocando) {
    btn.innerHTML = '';
    btn.appendChild(el('span', 'btn-ic', tocando ? '■' : '▶'));
    btn.appendChild(document.createTextNode(
      tocando ? ' Tocando — praticar' : ' Praticar (cantar junto)'));
  }

  function rotuloTrecho(btn, tempo, tocando) {
    btn.innerHTML = '';
    btn.appendChild(el('span', 'btn-ic', tocando ? '■' : '▶'));
    btn.appendChild(document.createTextNode(' ' + tempo));
  }

  // Devolve o rótulo de um botão ao estado parado, seja ele de trecho ou de entidade.
  function destacar(btn, tocando) {
    if (!btn) return;
    btn.classList.toggle('is-active', !!tocando);
    if (btn.classList.contains('btn-trecho')) {
      rotuloTrecho(btn, relogio(Number(btn.getAttribute('data-inicio')) || 0), tocando);
    } else {
      rotuloPraticar(btn, tocando);
    }
  }

  // ---------- Abrir / fechar ----------

  function abrir(sec) {
    sec.classList.add('open');
    sec.querySelector('.orixa-head').setAttribute('aria-expanded', 'true');
  }
  function fechar(sec) {
    sec.classList.remove('open');
    sec.querySelector('.orixa-head').setAttribute('aria-expanded', 'false');
  }
  function fecharTodas(exceto) {
    elLista.querySelectorAll('.orixa.open').forEach(function (s) {
      if (s !== exceto) fechar(s);
    });
  }
  function alternar(sec) {
    var aberta = sec.classList.contains('open');
    fecharTodas(sec);
    if (aberta) { fechar(sec); } else { abrir(sec); }
  }

  // ---------- Render de uma linha ----------

  function renderLinha(linhaId, opts) {
    opts = opts || {};
    var linha = acharLinha(linhaId) || LINHAS[0];
    if (!linha) return;

    elTitulo.innerHTML = linha.titulo || '';
    elSub.textContent  = linha.subtitulo || '';
    elNota.innerHTML   = linha.nota || '';
    elNota.hidden      = !linha.nota;

    elSwitch.querySelectorAll('.linha-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-linha') === linha.id));
    });

    var ents = linha.entidades || [];

    // Chips de navegação
    elToc.innerHTML = '';
    elTocWrap.hidden = ents.length === 0;
    ents.forEach(function (ent, i) {
      var chip = el('a', 'chip');
      chip.href = '#' + ent.id;
      chip.style.setProperty('--dot', ent.cor || '#B8892B');
      chip.setAttribute('data-target', ent.id);
      chip.appendChild(el('span', 'dot'));
      chip.appendChild(el('span', 'chip-num', numero(i)));
      chip.appendChild(document.createTextNode(' ' + (ent.nome || '')));
      chip.addEventListener('click', function () {
        var alvo = document.getElementById(ent.id);
        if (alvo && !alvo.classList.contains('open')) { fecharTodas(alvo); abrir(alvo); }
        elToc.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });
      elToc.appendChild(chip);
    });

    // Blocos
    elLista.innerHTML = '';
    if (ents.length === 0) {
      var vazio = el('div', 'vazio');
      vazio.appendChild(el('div', 'vazio-mark'));
      vazio.appendChild(el('h2', null, 'Ainda sem cantigas'));
      vazio.appendChild(el('p', null,
        'Esta linha já está montada e aparece aqui assim que as cantigas forem incluídas.'));
      elLista.appendChild(vazio);
    } else {
      ents.forEach(function (ent, i) { elLista.appendChild(montaEntidade(ent, i)); });
    }

    // Lista rápida de áudios
    elGrid.innerHTML = '';
    var comAudio = 0;
    ents.forEach(function (ent, i) {
      if (!ent.video) return;
      comAudio++;
      var b = el('button', 'quick-btn');
      b.type = 'button';
      b.style.setProperty('--accent', ent.cor || '#B8892B');
      b.setAttribute('data-vid', ent.video);
      b.setAttribute('data-name', ent.nome || '');
      b.appendChild(el('span', 'quick-num', numero(i)));
      b.appendChild(el('span', 'quick-name', ent.nome || ''));
      b.appendChild(el('span', 'quick-ic', '▶'));
      b.addEventListener('click', function () {
        tocar(ent.video, ent.nome || '', null);
      });
      elGrid.appendChild(b);
    });
    elRapido.hidden = comAudio === 0;

    // Liga os botões "Praticar" recém-criados
    elLista.querySelectorAll('.btn-practice').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('is-active')) { parar(); return; }
        tocar(btn.getAttribute('data-vid'), btn.getAttribute('data-name'), btn);
      });
    });

    // Abre a primeira, ou a entidade pedida pelo link direto
    var alvo = opts.abrir ? document.getElementById(opts.abrir) : null;
    if (alvo) {
      abrir(alvo);
      var chipAlvo = elToc.querySelector('.chip[data-target="' + opts.abrir + '"]');
      if (chipAlvo) chipAlvo.classList.add('active');
      if (opts.rolar) alvo.scrollIntoView({ block: 'start' });
    } else {
      var primeira = elLista.querySelector('.orixa');
      if (primeira) abrir(primeira);
    }

    // Se algo já estava tocando e o botão correspondente existe nesta linha,
    // remarca como ativo. Com um vídeo só por entidade, o tempo de início é o
    // que distingue um trecho do outro — casar só pelo id acenderia todos.
    if (vidAtual) {
      var seletor = inicioAtual == null
        ? '.btn-practice[data-vid="' + vidAtual + '"]'
        : '.btn-trecho[data-vid="' + vidAtual + '"][data-inicio="' + inicioAtual + '"]';
      marcarAtivo(elLista.querySelector(seletor) || null);
    }
  }

  // ---------- Player ----------

  var miniPlayer = document.getElementById('miniPlayer');
  var miniName   = document.getElementById('miniName');
  var btnAtivo    = null;
  var vidAtual    = null;
  var inicioAtual = null;

  function marcarAtivo(btn) {
    if (btnAtivo && btnAtivo !== btn) destacar(btnAtivo, false);
    btnAtivo = btn;
    destacar(btn, true);
  }

  // Player do YouTube pela API oficial (postMessage): é o que faz o autoplay
  // funcionar dentro do toque do usuário no Safari do iPhone.
  var ytPlayer = null;
  var ytPronto = false;
  var vidPendente = null;

  var ytTag = document.createElement('script');
  ytTag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(ytTag);

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytHost', {
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: function () {
          ytPronto = true;
          if (vidPendente) {
            ytPlayer.loadVideoById(vidPendente);
            ytPlayer.playVideo();
            vidPendente = null;
          }
        }

      }
    });
  };

  function tocar(vid, nome, btn, inicio) {
    if (!vid) return;
    vidAtual = vid;
    inicioAtual = (inicio == null ? null : Number(inicio));
    miniName.textContent = nome;
    miniPlayer.hidden = false;
    document.body.classList.add('has-player');
    marcarAtivo(btn);

    // A forma em objeto é a que aceita startSeconds; a API também aceita
    // esse mesmo objeto quando o player ainda está carregando.
    var pedido = { videoId: vid, startSeconds: inicioAtual || 0 };
    if (ytPronto && ytPlayer && ytPlayer.loadVideoById) {
      ytPlayer.loadVideoById(pedido);
      ytPlayer.playVideo();
    } else {
      vidPendente = pedido;
    }
  }

  function parar() {
    if (ytPronto && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    vidPendente = null;
    vidAtual = null;
    inicioAtual = null;
    miniPlayer.hidden = true;
    document.body.classList.remove('has-player');
    marcarAtivo(null);
  }

  document.getElementById('miniClose').addEventListener('click', parar);

  // ---------- Seletor de linha ----------

  LINHAS.forEach(function (linha) {
    var b = el('button', 'linha-btn', linha.rotulo || linha.id);
    b.type = 'button';
    b.setAttribute('data-linha', linha.id);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      if (b.getAttribute('aria-pressed') === 'true') return;
      lembrar(linha.id);
      renderLinha(linha.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    elSwitch.appendChild(b);
  });
  elSwitch.hidden = LINHAS.length < 2;

  // ---------- Partida ----------

  function inicial() {
    var alvo = (location.hash || '').replace('#', '');
    if (alvo) {
      var dono = linhaDaEntidade(alvo);
      if (dono) return { linha: dono, abrir: alvo, rolar: true };
      if (acharLinha(alvo)) return { linha: alvo };
    }
    var salva = lembrada();
    if (salva && acharLinha(salva)) return { linha: salva };
    return { linha: LINHAS.length ? LINHAS[0].id : null };
  }

  var ini = inicial();
  if (ini.linha) renderLinha(ini.linha, { abrir: ini.abrir, rolar: ini.rolar });

  window.addEventListener('hashchange', function () {
    var alvo = (location.hash || '').replace('#', '');
    if (!alvo) return;
    var dono = linhaDaEntidade(alvo);
    if (dono) {
      renderLinha(dono, { abrir: alvo, rolar: true });
      lembrar(dono);
    }
  });
})();
</script>
</body>
</html>
