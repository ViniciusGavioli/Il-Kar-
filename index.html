<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilê Asé Karè Oju Igbi — Cantigas de Caboclo</title>
<meta name="description" content="Pontos cantados de caboclo e boiadeiro, com letra e áudio de referência — Ilê Asé Karè Oju Igbi.">
<meta property="og:title" content="Ilê Asé Karè Oju Igbi — Cantigas de Caboclo">
<meta property="og:description" content="Pontos cantados de caboclo e boiadeiro, com letra e áudio de referência.">
<meta property="og:image" content="/crest.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#100E0B">
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<link rel="apple-touch-icon" href="/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   TOKENS
   Primitivas nunca são usadas direto nos componentes. Os componentes
   só falam a linguagem das semânticas, e a cor de cada orixá entra
   como --orixa, trocada por seção.
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* ---- primitivas: barro, palha, ouro, sangue ---- */
  --barro-950: #100E0B;
  --barro-900: #17130F;
  --barro-850: #1D1813;
  --barro-800: #241E17;
  --barro-700: #332A20;
  --barro-600: #473B2D;
  --palha-100: #F6EDDD;
  --palha-300: #DCCCB2;
  --palha-500: #A2907A;
  --ouro-300:  #F0DC9A;
  --ouro-400:  #E3C567;
  --ouro-500:  #C9A227;
  --ouro-700:  #8A6E1B;
  --sangue-400:#D2564E;
  --sangue-600:#8E2A26;

  /* ---- semânticas ---- */
  --fundo:        var(--barro-950);
  --superficie:   var(--barro-900);
  --superficie-2: var(--barro-850);
  --superficie-3: var(--barro-800);
  --borda:        var(--barro-700);
  --borda-forte:  var(--barro-600);
  --texto:        var(--palha-100);
  --texto-medio:  var(--palha-300);
  --texto-fraco:  var(--palha-500);
  --acento:       var(--ouro-500);
  --acento-claro: var(--ouro-400);
  --alerta:       var(--sangue-400);
  --alerta-fundo: #2A1714;
  --alerta-borda: #4A2723;

  /* cor da entidade — sobrescrita em cada seção */
  --orixa: var(--ouro-500);        /* preenchimento: conta, faixa, borda */
  --orixa-luz: var(--ouro-400);    /* a mesma cor quando vira TEXTO no escuro */
  --orixa-texto: #14110E;          /* o que se lê em cima do preenchimento */

  /* ---- tipografia ---- */
  --f-display: 'Fraunces', Georgia, serif;
  --f-letra:   'Source Serif 4', Georgia, serif;
  --f-ui:      'Inter', system-ui, -apple-system, sans-serif;

  --t-xs: 11px;
  --t-sm: 12.5px;
  --t-md: 14px;
  --t-lg: 16px;
  --t-xl: 20px;
  --t-2xl: 25px;
  --t-3xl: 33px;
  --t-4xl: 40px;
  /* o número mais importante da página: a letra é para cantar junto */
  --t-letra: 21px;
  --lh-letra: 1.52;

  /* ---- espaço (base 4) ---- */
  --e1: 4px;  --e2: 8px;  --e3: 12px; --e4: 16px;
  --e5: 20px; --e6: 24px; --e8: 32px; --e10: 40px; --e12: 48px;

  /* ---- forma e movimento ---- */
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-full: 999px;
  --sombra: 0 12px 34px rgba(0,0,0,.5);
  --d-rapido: 130ms;
  --d-normal: 260ms;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(760px 420px at 50% -6%, rgba(201,162,39,.16), transparent 64%),
    radial-gradient(520px 340px at 88% 12%, rgba(142,42,38,.10), transparent 70%),
    var(--fundo);
  background-attachment: fixed;
  color: var(--texto);
  font-family: var(--f-ui);
  font-size: var(--t-md);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 72px;
  transition: padding-bottom var(--d-rapido) var(--ease);
  overflow-x: hidden;
}
body.has-player { padding-bottom: 148px; }

/* ══════════ fio de contas — o divisor da casa ══════════ */
.contas {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: var(--e1) 0;
}
.contas span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--conta, var(--acento));
  flex: 0 0 auto;
}
.contas span:nth-child(even) {
  width: 5px; height: 5px;
  background: var(--conta-2, var(--borda-forte));
}
.contas--fio {
  position: relative;
}
.contas--fio::before {
  content: "";
  position: absolute;
  left: 8%; right: 8%; top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--borda-forte), transparent);
}
.contas--fio span { position: relative; }

/* ══════════ cabeçalho ══════════ */
header.hero {
  position: relative;
  text-align: center;
  padding: var(--e10) var(--e5) var(--e6);
  border-bottom: 1px solid var(--borda);
  background: linear-gradient(180deg, rgba(201,162,39,.07), transparent 70%);
}
.crest {
  width: 116px; height: 116px;
  display: block;
  margin: 0 auto var(--e4);
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(201,162,39,.45);
  box-shadow: 0 0 0 6px rgba(201,162,39,.06), 0 16px 40px rgba(0,0,0,.6);
}
.eyebrow {
  font-size: var(--t-xs);
  letter-spacing: .24em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--acento);
  margin-bottom: var(--e2);
}
h1 {
  font-family: var(--f-display);
  font-size: var(--t-3xl);
  font-weight: 700;
  line-height: 1.06;
  letter-spacing: -.01em;
  margin: 0 0 var(--e3);
  color: var(--texto);
}
.sub {
  color: var(--texto-medio);
  font-size: var(--t-md);
  line-height: 1.55;
  max-width: 420px;
  margin: var(--e3) auto 0;
}
.terreiro {
  margin-top: var(--e4);
  font-size: var(--t-sm);
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--acento-claro);
}

/* ══════════ seletor de linha ══════════ */
.linha-switch {
  display: flex;
  gap: var(--e1);
  max-width: 430px;
  margin: var(--e6) auto 0;
  padding: var(--e1);
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  border-radius: var(--r-full);
}
.linha-switch[hidden] { display: none; }
.linha-btn {
  flex: 1 1 0;
  min-width: 0;
  padding: 10px var(--e3);
  border: none;
  border-radius: var(--r-full);
  background: transparent;
  color: var(--texto-fraco);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: color var(--d-rapido) var(--ease), background var(--d-rapido) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.linha-btn[aria-pressed="true"] {
  background: linear-gradient(180deg, var(--acento-claro), var(--acento));
  color: #171208;
  box-shadow: 0 4px 14px rgba(201,162,39,.28);
}
.marca-manut {
  display: inline-block;
  width: 6px; height: 6px;
  margin-left: 6px;
  border-radius: 50%;
  background: var(--alerta);
  vertical-align: middle;
}
.linha-btn[aria-pressed="true"] .marca-manut { background: var(--sangue-600); }

/* ══════════ navegação por entidade ══════════ */
nav.toc-wrap {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: var(--e2) 0;
  background: rgba(16,14,11,.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--borda);
}
nav.toc-wrap[hidden] { display: none; }
.toc-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px var(--e4);
  scrollbar-width: none;
}
.toc-scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 13px;
  border-radius: var(--r-full);
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  color: var(--texto-medio);
  text-decoration: none;
  font-size: var(--t-sm);
  font-weight: 500;
  white-space: nowrap;
  transition: border-color var(--d-rapido) var(--ease), color var(--d-rapido) var(--ease);
}
.chip .dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--dot);
  box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 0 10px -1px var(--dot);
  flex: 0 0 auto;
}
.chip-num {
  font-size: var(--t-xs);
  color: var(--texto-fraco);
  font-variant-numeric: tabular-nums;
}
.chip.active {
  border-color: var(--dot);
  color: var(--texto);
  background: var(--superficie-3);
}

/* ══════════ corpo ══════════ */
main { max-width: 660px; margin: 0 auto; padding: var(--e5) var(--e4) 0; }

.aviso {
  background: var(--alerta-fundo);
  border: 1px solid var(--alerta-borda);
  border-left: 3px solid var(--alerta);
  border-radius: var(--r-md);
  padding: var(--e3) var(--e4);
  margin-bottom: var(--e4);
}
.aviso[hidden] { display: none; }
.aviso-rotulo {
  font-size: var(--t-xs);
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--alerta);
  margin-bottom: var(--e1);
}
.aviso-texto { font-size: var(--t-md); line-height: 1.55; color: #E8C4BF; }

.note {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-left: 3px solid var(--acento);
  border-radius: var(--r-md);
  padding: var(--e3) var(--e4);
  font-size: var(--t-md);
  line-height: 1.55;
  color: var(--texto-medio);
  margin-bottom: var(--e5);
}
.note strong { color: var(--acento-claro); font-weight: 600; }

/* ══════════ entidade ══════════ */
.orixa {
  position: relative;
  border: 1px solid var(--borda);
  border-radius: var(--r-lg);
  background: var(--superficie);
  margin-bottom: var(--e3);
  overflow: hidden;
  scroll-margin-top: 66px;
  transition: border-color var(--d-normal) var(--ease);
}
.orixa.open {
  border-color: color-mix(in srgb, var(--orixa) 42%, var(--borda));
  box-shadow: var(--sombra);
}
/* faixa da cor do orixá no topo do bloco aberto */
.orixa::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, var(--orixa), transparent 78%);
  opacity: 0;
  transition: opacity var(--d-normal) var(--ease);
}
.orixa.open::before { opacity: 1; }

.orixa-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--e3);
  padding: var(--e4);
  background: transparent;
  border: none;
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* o número é uma conta do fio */
.orixa-num {
  flex: 0 0 auto;
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--orixa);
  color: var(--orixa-texto);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: var(--t-md);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--orixa) 16%, transparent),
              0 6px 16px -4px var(--orixa);
}
.orixa-titles { flex: 1 1 auto; min-width: 0; }
.orixa-nome {
  display: block;
  font-family: var(--f-display);
  font-size: var(--t-xl);
  font-weight: 700;
  line-height: 1.16;
  color: var(--texto);
}
.orixa-yoruba {
  display: block;
  margin-top: 2px;
  font-size: var(--t-xs);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--orixa-luz);
  font-weight: 600;
}
.chevron {
  flex: 0 0 auto;
  color: var(--texto-fraco);
  font-size: var(--t-lg);
  transition: transform var(--d-normal) var(--ease), color var(--d-normal) var(--ease);
}
.orixa.open .chevron { transform: rotate(180deg); color: var(--orixa-luz); }

.orixa-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--d-normal) var(--ease);
}
.orixa.open .orixa-body { grid-template-rows: 1fr; }
.orixa-body-inner { overflow: hidden; padding: 0 var(--e4); }
.orixa.open .orixa-body-inner { padding: 0 var(--e4) var(--e5); }

/* ══════════ cantiga ══════════ */
.cantiga { padding: var(--e4) 0; border-top: 1px solid var(--borda); }
.cantiga:first-child { border-top: none; padding-top: var(--e2); }
.cantiga-topo {
  display: flex;
  align-items: center;
  gap: var(--e3);
  margin-bottom: var(--e2);
}
.cantiga-tag {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--t-xs);
  letter-spacing: .13em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--orixa-luz);
}
.lyric {
  font-family: var(--f-letra);
  font-weight: 600;
  font-size: var(--t-letra);
  line-height: var(--lh-letra);
  color: var(--texto);
  margin: 0 0 var(--e3);
  text-wrap: pretty;
}
.trad {
  font-size: var(--t-md);
  line-height: 1.6;
  color: var(--texto-fraco);
  margin: 0;
  padding-left: var(--e3);
  border-left: 2px solid var(--borda);
}

/* ══════════ botões ══════════ */
.actions { display: flex; flex-wrap: wrap; gap: var(--e2); margin-top: var(--e4); }
.btn {
  flex: 1 1 auto;
  min-width: 142px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px var(--e4);
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font-family: inherit;
  font-size: var(--t-md);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: transform var(--d-rapido) var(--ease), background var(--d-rapido) var(--ease);
}
.btn:active { transform: scale(.985); }
.btn-ic { font-size: 10px; }
.btn-ghost {
  background: var(--superficie-2);
  border-color: var(--borda);
  color: var(--texto-medio);
}
.btn-practice {
  flex-basis: 100%;
  background: linear-gradient(180deg, var(--acento-claro), var(--acento));
  color: #171208;
  box-shadow: 0 6px 20px -6px rgba(201,162,39,.6);
}
.btn-practice.is-active {
  background: var(--superficie-3);
  border-color: var(--acento);
  color: var(--acento-claro);
  box-shadow: none;
}
/* botão de horário: pertence à cor do orixá */
/* quantas vezes o ponto inteiro é cantado */
.marca-repete {
  flex: 0 0 auto;
  padding: 4px 9px;
  border-radius: var(--r-full);
  border: 1px solid var(--borda);
  background: var(--superficie-2);
  color: var(--texto-fraco);
  font-size: var(--t-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
.btn-trecho {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-full);
  border: 1px solid color-mix(in srgb, var(--orixa-luz) 50%, transparent);
  background: color-mix(in srgb, var(--orixa-luz) 12%, transparent);
  color: var(--orixa-luz);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background var(--d-rapido) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.btn-trecho:active { transform: scale(.97); }
.btn-trecho.is-active {
  background: var(--orixa-luz);
  color: #14110E;
  border-color: var(--orixa-luz);
}
.btn-trecho .btn-ic { font-size: 9px; }

/* ══════════ estado vazio ══════════ */
.vazio {
  border: 1px dashed var(--borda-forte);
  border-radius: var(--r-lg);
  background: var(--superficie);
  padding: var(--e12) var(--e6);
  text-align: center;
}
.vazio h2 {
  font-family: var(--f-display);
  font-size: var(--t-xl);
  color: var(--texto);
  margin: var(--e4) 0 var(--e2);
}
.vazio p { font-size: var(--t-md); line-height: 1.6; color: var(--texto-fraco); margin: 0; }

/* ══════════ lista rápida ══════════ */
#blocoRapido[hidden] { display: none; }
.quick-title {
  font-family: var(--f-display);
  font-size: var(--t-2xl);
  font-weight: 700;
  color: var(--texto);
  margin: var(--e10) 0 var(--e1);
}
.quick-sub { color: var(--texto-fraco); font-size: var(--t-md); margin: 0 0 var(--e4); }
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
.quick-btn {
  display: flex;
  align-items: center;
  gap: var(--e2);
  padding: var(--e3);
  border-radius: var(--r-md);
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-left: 3px solid var(--orixa);
  color: var(--texto-medio);
  font-family: inherit;
  font-size: var(--t-sm);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  width: 100%;
}
.quick-num { font-size: var(--t-xs); color: var(--texto-fraco); font-variant-numeric: tabular-nums; }
.quick-name { flex: 1; min-width: 0; }
.quick-ic { color: var(--orixa-luz); font-size: 10px; }

/* ══════════ player fixo ══════════ */
.mini-player {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: rgba(23,19,15,.97);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--borda-forte);
  box-shadow: 0 -12px 34px rgba(0,0,0,.55);
  padding: var(--e3) var(--e3) calc(var(--e3) + env(safe-area-inset-bottom));
}
.mini-player[hidden] { display: none; }
.mini-player-inner {
  display: flex;
  align-items: center;
  gap: var(--e3);
  max-width: 660px;
  margin: 0 auto;
}
.mini-embed {
  position: relative;
  flex: 0 0 auto;
  width: 104px; height: 59px;
  border-radius: var(--r-sm);
  overflow: hidden;
  background: #000;
  border: 1px solid var(--borda);
}
.mini-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mini-info { flex: 1 1 auto; min-width: 0; }
.mini-eyebrow {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--acento);
}
.mini-name {
  font-family: var(--f-display);
  font-size: var(--t-lg);
  font-weight: 700;
  color: var(--texto);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mini-close {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--borda-forte);
  background: var(--superficie-2);
  color: var(--texto-medio);
  font-size: var(--t-xl);
  line-height: 1;
  cursor: pointer;
}

footer {
  text-align: center;
  color: var(--texto-fraco);
  font-size: var(--t-sm);
  line-height: 1.7;
  margin-top: var(--e12);
  padding: var(--e6) var(--e5) 0;
  border-top: 1px solid var(--borda);
}
footer strong { color: var(--texto-medio); }
footer .credit { display: block; margin-top: var(--e2); font-size: var(--t-xs); color: var(--barro-600); }

/* ══════════ telas maiores ══════════ */
@media (min-width: 560px) {
  :root { --t-3xl: 40px; --t-letra: 22px; }
  .crest { width: 132px; height: 132px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header class="hero">
  <img class="crest" src="/crest.jpg" alt="Emblema do Ilê Asé Karè Oju Igbi">
  <div class="eyebrow">Material de apoio interno</div>
  <h1 id="heroTitulo"></h1>
  <div class="contas contas--fio" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="sub" id="heroSub"></p>
  <div class="terreiro">Ilê Asé Karè Oju Igbi</div>
  <div class="linha-switch" id="linhaSwitch"></div>
</header>

<nav class="toc-wrap" id="tocWrap"><div class="toc-scroll" id="tocScroll"></div></nav>

<main>
  <div class="aviso" id="aviso" hidden>
    <div class="aviso-rotulo">Em manutenção</div>
    <div class="aviso-texto" id="avisoTexto"></div>
  </div>
  <div class="note" id="nota"></div>
  <div id="listaEntidades"></div>

  <div id="blocoRapido" hidden>
    <h2 class="quick-title">Lista rápida de áudios</h2>
    <p class="quick-sub">Se algum botão acima não abrir corretamente, use este atalho direto.</p>
    <div class="quick-grid" id="quickGrid"></div>
  </div>

  <footer>
    <strong>Ilê Asé Karè Oju Igbi</strong> — Cantigas de Caboclo<br>
    Material de apoio interno para estudo.
    <span class="credit">ileasekareojuigbi.vercel.app</span>
  </footer>
</main>

<div class="mini-player" id="miniPlayer" hidden>
  <div class="mini-player-inner">
    <div class="mini-embed"><div id="ytHost"></div></div>
    <div class="mini-info">
      <div class="mini-eyebrow">Praticando</div>
      <div class="mini-name" id="miniName"></div>
    </div>
    <button type="button" class="mini-close" id="miniClose" aria-label="Fechar player">&times;</button>
  </div>
</div>

<script src="/dados.js"></script>
<script>
(function () {
  'use strict';

  var LINHAS = window.CANTIGAS || [];

  var elSwitch  = document.getElementById('linhaSwitch');
  var elTitulo  = document.getElementById('heroTitulo');
  var elSub     = document.getElementById('heroSub');
  var elNota    = document.getElementById('nota');
  var elAviso   = document.getElementById('aviso');
  var elAvisoTx = document.getElementById('avisoTexto');
  var elTocWrap = document.getElementById('tocWrap');
  var elToc     = document.getElementById('tocScroll');
  var elLista   = document.getElementById('listaEntidades');
  var elRapido  = document.getElementById('blocoRapido');
  var elGrid    = document.getElementById('quickGrid');

  var CHAVE = 'cantigas:linha';
  function lembrar(id) { try { localStorage.setItem(CHAVE, id); } catch (e) {} }
  function lembrada()  { try { return localStorage.getItem(CHAVE); } catch (e) { return null; } }

  function numero(i) { return (i + 1 < 10 ? '0' : '') + (i + 1); }
  function relogio(seg) {
    var m = Math.floor(seg / 60), s = Math.floor(seg % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------- cor ----------
     O dados.js informa só a cor da entidade. Daqui saem as outras duas:
     a cor do número sobre ela, e uma versão clareada para quando a cor
     precisa virar TEXTO sobre o fundo escuro — porque cores escuras como
     o azul de Ogum e o vermelho de Xangô não têm contraste suficiente
     para serem lidas como texto. */
  var FUNDO_CARTAO = [0x17, 0x13, 0x0F];

  function paraRgb(hex) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function luminancia(rgb) {
    var c = rgb.map(function (v) {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contraste(a, b) {
    var x = luminancia(a), y = luminancia(b);
    if (x < y) { var t = x; x = y; y = t; }
    return (x + 0.05) / (y + 0.05);
  }
  function corDoNumero(hex) {
    return luminancia(paraRgb(hex)) > 0.179 ? '#14110E' : '#FFFFFF';
  }
  // Clareia em direção ao branco até alcançar contraste de leitura (4.5:1).
  function corParaTexto(hex) {
    var rgb = paraRgb(hex);
    for (var p = 0; p <= 100; p += 4) {
      var c = rgb.map(function (v) { return Math.round(v + (255 - v) * (p / 100)); });
      if (contraste(c, FUNDO_CARTAO) >= 4.5) {
        return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      }
    }
    return '#F6EDDD';
  }

  function el(tag, cls, texto) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texto != null) n.textContent = texto;
    return n;
  }

  // fio de contas na cor da entidade
  function contas(n, cor) {
    var f = el('div', 'contas');
    f.setAttribute('aria-hidden', 'true');
    if (cor) f.style.setProperty('--conta', cor);
    for (var i = 0; i < n; i++) f.appendChild(el('span'));
    return f;
  }

  function acharLinha(id) {
    for (var i = 0; i < LINHAS.length; i++) if (LINHAS[i].id === id) return LINHAS[i];
    return null;
  }
  function linhaDaEntidade(entId) {
    for (var i = 0; i < LINHAS.length; i++) {
      var ents = LINHAS[i].entidades || [];
      for (var j = 0; j < ents.length; j++) if (ents[j].id === entId) return LINHAS[i].id;
    }
    return null;
  }

  function rotuloPraticar(btn, tocando) {
    btn.innerHTML = '';
    btn.appendChild(el('span', 'btn-ic', tocando ? '■' : '▶'));
    btn.appendChild(document.createTextNode(
      tocando ? ' Tocando — praticar' : ' Praticar (cantar junto)'));
  }
  function rotuloTrecho(btn, tempo, tocando) {
    btn.innerHTML = '';
    btn.appendChild(el('span', 'btn-ic', tocando ? '■' : '▶'));
    btn.appendChild(document.createTextNode(' ' + tempo));
  }
  function destacar(btn, tocando) {
    if (!btn) return;
    btn.classList.toggle('is-active', !!tocando);
    if (btn.classList.contains('btn-trecho')) {
      rotuloTrecho(btn, relogio(Number(btn.getAttribute('data-inicio')) || 0), tocando);
    } else {
      rotuloPraticar(btn, tocando);
    }
  }

  function montaCantiga(c, ent) {
    var box = el('div', 'cantiga');

    var topo = el('div', 'cantiga-topo');
    topo.appendChild(el('div', 'cantiga-tag', c.rotulo || ''));

    if (c.repete) {
      var rep = el('span', 'marca-repete', c.repete + '×');
      rep.title = 'O ponto inteiro se canta ' + c.repete + ' vezes';
      topo.appendChild(rep);
    }

    // Um vídeo só para a entidade inteira: cada cantiga ganha um botão que
    // pula direto para o seu momento dentro dele.
    var vid = c.video || ent.video;
    if (vid && c.inicio != null) {
      var bt = el('button', 'btn-trecho');
      bt.type = 'button';
      bt.setAttribute('data-vid', vid);
      bt.setAttribute('data-inicio', String(c.inicio));
      bt.setAttribute('data-name', (ent.nome || '') + ' — ' + (c.rotulo || ''));
      bt.setAttribute('aria-label', 'Tocar a partir de ' + relogio(c.inicio));
      rotuloTrecho(bt, relogio(c.inicio), false);
      bt.addEventListener('click', function () {
        if (bt.classList.contains('is-active')) { parar(); return; }
        tocar(vid, bt.getAttribute('data-name'), bt, c.inicio);
      });
      topo.appendChild(bt);
    }
    box.appendChild(topo);

    var p = el('p', 'lyric');
    var versos = c.letra || [];
    for (var i = 0; i < versos.length; i++) {
      if (i > 0) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(versos[i]));
    }
    box.appendChild(p);

    if (c.traducao) box.appendChild(el('p', 'trad', c.traducao));
    return box;
  }

  function montaEntidade(ent, i) {
    var sec = el('section', 'orixa');
    sec.id = ent.id;
    var cor = ent.cor || '#C9A227';
    sec.style.setProperty('--orixa', cor);
    sec.style.setProperty('--orixa-texto', corDoNumero(cor));
    sec.style.setProperty('--orixa-luz', corParaTexto(cor));

    var head = el('button', 'orixa-head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    head.appendChild(el('span', 'orixa-num', numero(i)));

    var titulos = el('span', 'orixa-titles');
    titulos.appendChild(el('span', 'orixa-nome', ent.nome || ''));
    if (ent.subtitulo) titulos.appendChild(el('span', 'orixa-yoruba', ent.subtitulo));
    head.appendChild(titulos);
    head.appendChild(el('span', 'chevron', '⌄'));
    sec.appendChild(head);

    var body  = el('div', 'orixa-body');
    var inner = el('div', 'orixa-body-inner');
    inner.appendChild(contas(9, corParaTexto(cor)));

    (ent.cantigas || []).forEach(function (c) { inner.appendChild(montaCantiga(c, ent)); });

    var acoes = el('div', 'actions');
    if (ent.video) {
      var praticar = el('button', 'btn btn-practice');
      praticar.type = 'button';
      praticar.setAttribute('data-vid', ent.video);
      praticar.setAttribute('data-name', ent.nome || '');
      rotuloPraticar(praticar, false);
      acoes.appendChild(praticar);
    }
    if (ent.youtube) {
      var ly = el('a', 'btn btn-ghost', 'Abrir no YouTube');
      ly.href = ent.youtube; ly.target = '_blank'; ly.rel = 'noopener';
      acoes.appendChild(ly);
    }
    if (ent.fonte) {
      var lf = el('a', 'btn btn-ghost', 'Ver fonte da letra');
      lf.href = ent.fonte; lf.target = '_blank'; lf.rel = 'noopener';
      acoes.appendChild(lf);
    }
    if (acoes.childNodes.length) inner.appendChild(acoes);

    body.appendChild(inner);
    sec.appendChild(body);
    head.addEventListener('click', function () { alternar(sec); });
    return sec;
  }

  function abrir(sec) {
    sec.classList.add('open');
    sec.querySelector('.orixa-head').setAttribute('aria-expanded', 'true');
  }
  function fechar(sec) {
    sec.classList.remove('open');
    sec.querySelector('.orixa-head').setAttribute('aria-expanded', 'false');
  }
  function fecharTodas(exceto) {
    elLista.querySelectorAll('.orixa.open').forEach(function (s) { if (s !== exceto) fechar(s); });
  }
  function alternar(sec) {
    var aberta = sec.classList.contains('open');
    fecharTodas(sec);
    if (aberta) { fechar(sec); } else { abrir(sec); }
  }

  function renderLinha(linhaId, opts) {
    opts = opts || {};
    var linha = acharLinha(linhaId) || LINHAS[0];
    if (!linha) return;

    elTitulo.innerHTML = linha.titulo || '';
    elSub.textContent  = linha.subtitulo || '';
    elNota.innerHTML   = linha.nota || '';
    elNota.hidden      = !linha.nota;

    // Linha em revisão: o aviso vem antes de tudo, para ninguém estudar por
    // uma letra que a casa ainda não conferiu.
    elAvisoTx.textContent = linha.manutencao || '';
    elAviso.hidden = !linha.manutencao;

    elSwitch.querySelectorAll('.linha-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-linha') === linha.id));
    });

    var ents = linha.entidades || [];

    elToc.innerHTML = '';
    // Com uma entidade só a navegação seria um chip solto — não vale a barra.
    elTocWrap.hidden = ents.length < 2;
    ents.forEach(function (ent, i) {
      var chip = el('a', 'chip');
      chip.href = '#' + ent.id;
      // No chip a cor vira ponto de 9px e borda fina: usa a versão clareada,
      // senão as cores escuras somem contra o fundo.
      chip.style.setProperty('--dot', corParaTexto(ent.cor || '#C9A227'));
      chip.setAttribute('data-target', ent.id);
      chip.appendChild(el('span', 'dot'));
      chip.appendChild(el('span', 'chip-num', numero(i)));
      chip.appendChild(document.createTextNode(' ' + (ent.nome || '')));
      chip.addEventListener('click', function () {
        var alvo = document.getElementById(ent.id);
        if (alvo && !alvo.classList.contains('open')) { fecharTodas(alvo); abrir(alvo); }
        elToc.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });
      elToc.appendChild(chip);
    });

    elLista.innerHTML = '';
    if (ents.length === 0) {
      var vazio = el('div', 'vazio');
      vazio.appendChild(contas(9));
      vazio.appendChild(el('h2', null, 'Ainda sem cantigas'));
      vazio.appendChild(el('p', null,
        'Esta linha já está montada e aparece aqui assim que as cantigas forem incluídas.'));
      elLista.appendChild(vazio);
    } else {
      ents.forEach(function (ent, i) { elLista.appendChild(montaEntidade(ent, i)); });
    }

    elGrid.innerHTML = '';
    var comAudio = 0;
    ents.forEach(function (ent, i) {
      if (!ent.video) return;
      comAudio++;
      var b = el('button', 'quick-btn');
      b.type = 'button';
      b.style.setProperty('--orixa', ent.cor || '#C9A227');
      b.style.setProperty('--orixa-luz', corParaTexto(ent.cor || '#C9A227'));
      b.appendChild(el('span', 'quick-num', numero(i)));
      b.appendChild(el('span', 'quick-name', ent.nome || ''));
      b.appendChild(el('span', 'quick-ic', '▶'));
      b.addEventListener('click', function () { tocar(ent.video, ent.nome || '', null); });
      elGrid.appendChild(b);
    });
    // Idem: atalho de áudio só faz sentido havendo mais de um para escolher.
    elRapido.hidden = comAudio < 2;

    elLista.querySelectorAll('.btn-practice').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('is-active')) { parar(); return; }
        tocar(btn.getAttribute('data-vid'), btn.getAttribute('data-name'), btn);
      });
    });

    var alvo = opts.abrir ? document.getElementById(opts.abrir) : null;
    if (alvo) {
      abrir(alvo);
      var chipAlvo = elToc.querySelector('.chip[data-target="' + opts.abrir + '"]');
      if (chipAlvo) chipAlvo.classList.add('active');
      if (opts.rolar) alvo.scrollIntoView({ block: 'start' });
    } else {
      var primeira = elLista.querySelector('.orixa');
      if (primeira) abrir(primeira);
    }

    // Se algo já estava tocando e o botão correspondente existe nesta linha,
    // remarca como ativo. Com um vídeo só por entidade, o tempo de início é o
    // que distingue um trecho do outro — casar só pelo id acenderia todos.
    if (vidAtual) {
      var seletor = inicioAtual == null
        ? '.btn-practice[data-vid="' + vidAtual + '"]'
        : '.btn-trecho[data-vid="' + vidAtual + '"][data-inicio="' + inicioAtual + '"]';
      marcarAtivo(elLista.querySelector(seletor) || null);
    }
  }

  /* ---------- player ---------- */
  var miniPlayer  = document.getElementById('miniPlayer');
  var miniName    = document.getElementById('miniName');
  var btnAtivo    = null;
  var vidAtual    = null;
  var inicioAtual = null;

  function marcarAtivo(btn) {
    if (btnAtivo && btnAtivo !== btn) destacar(btnAtivo, false);
    btnAtivo = btn;
    destacar(btn, true);
  }

  // Player do YouTube pela API oficial (postMessage): é o que faz o autoplay
  // funcionar dentro do toque do usuário no Safari do iPhone.
  var ytPlayer = null, ytPronto = false, vidPendente = null;

  var ytTag = document.createElement('script');
  ytTag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(ytTag);

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytHost', {
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: function () {
          ytPronto = true;
          if (vidPendente) {
            ytPlayer.loadVideoById(vidPendente);
            ytPlayer.playVideo();
            vidPendente = null;
          }
        }
      }
    });
  };

  function tocar(vid, nome, btn, inicio) {
    if (!vid) return;
    vidAtual = vid;
    inicioAtual = (inicio == null ? null : Number(inicio));
    miniName.textContent = nome;
    miniPlayer.hidden = false;
    document.body.classList.add('has-player');
    marcarAtivo(btn);

    // A forma em objeto é a que aceita startSeconds; a API também aceita
    // esse mesmo objeto quando o player ainda está carregando.
    var pedido = { videoId: vid, startSeconds: inicioAtual || 0 };
    if (ytPronto && ytPlayer && ytPlayer.loadVideoById) {
      ytPlayer.loadVideoById(pedido);
      ytPlayer.playVideo();
    } else {
      vidPendente = pedido;
    }
  }

  function parar() {
    if (ytPronto && ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    vidPendente = null;
    vidAtual = null;
    inicioAtual = null;
    miniPlayer.hidden = true;
    document.body.classList.remove('has-player');
    marcarAtivo(null);
  }

  document.getElementById('miniClose').addEventListener('click', parar);

  /* ---------- seletor de linha ---------- */
  LINHAS.forEach(function (linha) {
    var b = el('button', 'linha-btn', linha.rotulo || linha.id);
    b.type = 'button';
    b.setAttribute('data-linha', linha.id);
    b.setAttribute('aria-pressed', 'false');
    if (linha.manutencao) {
      b.appendChild(el('span', 'marca-manut'));
      b.title = 'Em manutenção';
    }
    b.addEventListener('click', function () {
      if (b.getAttribute('aria-pressed') === 'true') return;
      lembrar(linha.id);
      renderLinha(linha.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    elSwitch.appendChild(b);
  });
  elSwitch.hidden = LINHAS.length < 2;

  /* ---------- partida ---------- */
  function inicial() {
    var alvo = (location.hash || '').replace('#', '');
    if (alvo) {
      var dono = linhaDaEntidade(alvo);
      if (dono) return { linha: dono, abrir: alvo, rolar: true };
      if (acharLinha(alvo)) return { linha: alvo };
    }
    var salva = lembrada();
    if (salva && acharLinha(salva)) return { linha: salva };
    return { linha: LINHAS.length ? LINHAS[0].id : null };
  }

  var ini = inicial();
  if (ini.linha) renderLinha(ini.linha, { abrir: ini.abrir, rolar: ini.rolar });

  window.addEventListener('hashchange', function () {
    var alvo = (location.hash || '').replace('#', '');
    if (!alvo) return;
    var dono = linhaDaEntidade(alvo);
    if (dono) { renderLinha(dono, { abrir: alvo, rolar: true }); lembrar(dono); }
  });
})();
</script>
</body>
</html>
